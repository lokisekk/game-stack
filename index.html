<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LOKIS STACK - TURBO + ADMIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none}
body{background:#07070a;color:#fff;font-family:Arial;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px;overflow:hidden}
h1{color:gold;font-family:monospace;letter-spacing:3px;text-shadow:0 0 15px gold;margin:8px;font-size:20px;cursor:pointer}
.top{display:flex;gap:8px;justify-content:center;align-items:center;background:#111;border:2px solid #222;padding:8px 14px;border-radius:30px;font-size:11px;flex-wrap:wrap}
.top b{color:gold}
#gameWrap{position:relative;width:100%;max-width:400px;height:600px;max-height:70vh;background:linear-gradient(180deg,#0a0a14 0%,#111 60%,#1a1a00 100%);border:3px solid #222;border-radius:20px;overflow:hidden;margin-top:8px}
canvas{display:block;width:100%;height:100%}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;text-align:center;padding:16px}
#overlay.hidden{display:none}
.btn{padding:10px 16px;border-radius:12px;border:none;font-weight:900;cursor:pointer;font-size:11px}
.btn-gold{background:linear-gradient(45deg,gold,#ff8c00);color:#000;box-shadow:0 0 10px gold}
.btn-dark{background:#222;color:#888;border:1px solid #333}
.btn-admin{background:linear-gradient(45deg,#a0f,#f0a);color:#fff;box-shadow:0 0 8px #a0f}
.perfect{position:absolute;left:50%;transform:translateX(-50%);color:#0f0;font-weight:900;font-size:16px;text-shadow:0 0 10px #0f0;animation:pop .6s forwards;pointer-events:none;z-index:10}
@keyframes pop{0%{transform:translate(-50%,0) scale(.5);opacity:1}100%{transform:translate(-50%,-40px) scale(1.4);opacity:0}}
#adminPanel{display:none;width:100%;max-width:420px;background:linear-gradient(180deg,#1a0a2a,#0a0a1a);border:2px solid #a0f;border-radius:16px;padding:12px;margin:10px 0;box-shadow:0 0 20px rgba(160,0,255,.4)}
#adminPanel.open{display:block}
.admin-title{color:#a0f;font-family:monospace;font-weight:900;letter-spacing:2px;text-align:center;margin-bottom:8px}
.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.admin-card{background:#000;border:1px solid #333;border-radius:10px;padding:8px;text-align:center}
.admin-card b{color:#a0f;font-size:9px;display:block;margin-bottom:4px}
.admin-input{width:100%;background:#111;color:#fff;border:1px solid #333;padding:6px;border-radius:6px;text-align:center;font-size:11px;margin:3px 0}
</style>
</head>
<body>
<h1 id="logo" onclick="secretAdmin()">🗼 LOKIS STACK TURBO 🗼</h1>
<div class="top">
<div>🏗️ VÝŠKA: <b id="score">0</b></div>
<div>🏆 BEST: <b id="best" style="color:gold">0</b></div>
<div>💰 <b id="money">0</b>¢</div>
<div>⚡ Rychlost: <b id="speedTop" style="color:#0f0">2.2</b></div>
</div>

<div id="adminPanel">
<div class="admin-title">🔐 ADMIN PANEL</div>
<div class="admin-grid">
<div class="admin-card"><b>💰 COINY</b><input id="addMoney" class="admin-input" type="number" value="1000"><button class="btn btn-gold" style="width:100%;margin-top:3px" onclick="adminAddMoney()">+ PŘIDAT</button><button class="btn btn-dark" style="width:100%;margin-top:3px" onclick="adminSetMoney()">NASTAVIT 10K</button></div>
<div class="admin-card"><b>🏗️ VÝŠKA / BEST</b><input id="setScore" class="admin-input" type="number" value="50"><button class="btn btn-gold" style="width:100%;margin-top:3px" onclick="adminSetScore()">NASTAVIT VÝŠKU</button><button class="btn btn-dark" style="width:100%;margin-top:3px" onclick="adminSetBest()">BEST = VÝŠKA</button></div>
<div class="admin-card"><b>📏 ŠÍŘKA BLOKU</b><button class="btn btn-admin" style="width:100%" onclick="adminWider()">+ ŠIRŠÍ BLOK</button><button class="btn btn-green" style="width:100%;margin-top:3px;background:#0f0;color:#000" onclick="adminPerfect()">💯 PERFECT MODE</button></div>
<div class="admin-card"><b>⚡ RYCHLOST HRY</b><button class="btn btn-dark" style="width:100%" onclick="adminSpeed(1)">🐢 POMALU 2x</button><button class="btn btn-gold" style="width:100%;margin-top:3px" onclick="adminSpeed(2)">⚡ TURBO 2x</button><button class="btn btn-dark" style="width:100%;margin-top:3px" onclick="adminSpeed(0)">RESET RYCHLOST</button></div>
<div class="admin-card"><b>🎮 CHEATY</b><button class="btn btn-admin" style="width:100%" onclick="adminNoCut()">✂️ BEZ OŘEZU</button><button class="btn btn-dark" style="width:100%;margin-top:3px" onclick="adminNoCutOff()">Vypnout</button></div>
<div class="admin-card"><b>⚙️ SYSTÉM</b><button class="btn btn-dark" style="width:100%" onclick="adminReset()">RESET VŠE</button><button class="btn btn-dark" style="width:100%;margin-top:3px;border-color:#f55;color:#f88" onclick="closeAdmin()">ZAVŘÍT ADMIN</button></div>
</div>
</div>

<div id="gameWrap">
<canvas id="c" width="400" height="600"></canvas>
<div id="overlay">
<div style="font-size:50px">🗼</div>
<div style="font-size:22px;font-weight:900">STACK TURBO</div>
<div style="color:#0f0;font-size:11px;margin:4px">⚡ 2x RYCHLEJŠÍ NEŽ PŘEDTÍM ⚡</div>
<div style="color:#888;font-size:9px;margin:6px;max-width:280px">Tap = položit blok<br>Perfect <6px = bonus<br>5x klik na logo = admin</div>
<div style="margin:10px 0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
<button class="btn btn-gold" onclick="startGame()">▶️ STAVĚT TURBO</button>
<button class="btn btn-admin" onclick="openAdmin()">🔐 ADMIN</button>
</div>
</div>
</div>

<div style="margin-top:10px;display:flex;gap:8px">
<button class="btn btn-gold" id="tapBtn" style="padding:16px 40px;font-size:18px">🏗️ POLOŽIT</button>
<button class="btn btn-dark" onclick="resetAll()">RESET</button>
</div>

<script>
const $=id=>document.getElementById(id);
let canvas=$('c'), ctx=canvas.getContext('2d');
let money=parseInt(localStorage.getItem('stack_money')||'0');
let best=parseInt(localStorage.getItem('stack_best')||'0');
let score=0, blocks=[], curBlock=null, dir=1, baseSpeed=4.0, speed=4.0, gameState='menu', perfectStreak=0;
let adminMode=false, noCut=false, perfectMode=false, clicks=0;

function save(){localStorage.setItem('stack_money',money); localStorage.setItem('stack_best',best); updateUI();}
function updateUI(){$('score').textContent=score; $('best').textContent=best; $('money').textContent=money; $('speedTop').textContent=speed.toFixed(1);}

function startGame(){
 blocks=[]; score=0; speed=baseSpeed; perfectStreak=0; noCut=adminMode?noCut:false;
 blocks.push({x:100,y:500,w:200,h:20,color:'#222'});
 spawnBlock();
 gameState='play'; $('overlay').classList.add('hidden'); updateUI(); loop();
}
function spawnBlock(){
 let last=blocks[blocks.length-1];
 let w=last.w; let y=last.y-22; let x= dir===1 ? -w : canvas.width;
 curBlock={x:x,y:y,w:w,h:20,color:`hsl(${40+score*3},100%,50%)`, moving:true};
}
function place(){
 if(gameState!=='play'){if(gameState==='menu') startGame(); return;}
 if(!curBlock) return;
 let last=blocks[blocks.length-1];
 let overlap=Math.max(0, Math.min(curBlock.x+curBlock.w, last.x+last.w) - Math.max(curBlock.x, last.x));
 if(overlap<=0 && !noCut){die(); return;}
 if(noCut){curBlock.x=last.x; curBlock.w=last.w;}
 let diff=Math.abs(curBlock.x-last.x);
 let perfect= perfectMode || diff<8;
 if(perfect){
  perfectStreak++; curBlock.x=last.x; if(!noCut) curBlock.w=last.w;
  money+=5+perfectStreak; showPerfect(perfectStreak>2?`PERFECT x${perfectStreak}!`:'PERFECT!');
  if(perfectStreak>=2 && curBlock.w<260) curBlock.w+=8;
 } else {
  perfectStreak=0; if(!noCut){curBlock.w=overlap; curBlock.x=Math.max(curBlock.x, last.x);} money+=1;
 }
 curBlock.moving=false; blocks.push(curBlock); score=blocks.length-1;
 if(score>best){best=score; localStorage.setItem('stack_best',best);} save();
 speed=Math.min(9, baseSpeed+score*0.18); // TURBO zrychlování
 dir*=-1;
 let nextW=curBlock.w, nextY=curBlock.y-22, nextX= dir===1 ? -nextW : canvas.width;
 curBlock={x:nextX,y:nextY,w:nextW,h:20,color:`hsl(${40+score*4},100%,50%)`, moving:true};
 if(curBlock.y<150){blocks.forEach(b=>b.y+=22); curBlock.y+=22;}
 updateUI();
}
function showPerfect(t){let el=document.createElement('div'); el.className='perfect'; el.textContent=t; el.style.top='120px'; $('gameWrap').appendChild(el); setTimeout(()=>el.remove(),600);}
function loop(){
 if(gameState!=='play') return;
 if(curBlock && curBlock.moving){curBlock.x+=speed*dir; if(curBlock.x>canvas.width || curBlock.x+curBlock.w<0) dir*=-1;}
 draw(); requestAnimationFrame(loop);
}
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.strokeStyle='rgba(255,255,255,0.03)'; ctx.lineWidth=1;
 for(let x=0;x<canvas.width;x+=20){ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();}
 for(let y=0;y<canvas.height;y+=20){ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();}
 blocks.forEach(b=>{ctx.fillStyle=b.color; ctx.strokeStyle='#000'; ctx.lineWidth=2; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.strokeRect(b.x,b.y,b.w,b.h); ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fillRect(b.x,b.y,b.w,4);});
 if(curBlock){ctx.fillStyle=curBlock.color; ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.fillRect(curBlock.x,curBlock.y,curBlock.w,curBlock.h); ctx.strokeRect(curBlock.x,curBlock.y,curBlock.w,curBlock.h); ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillRect(curBlock.x,curBlock.y,curBlock.w,4);}
 ctx.fillStyle='#fff'; ctx.font='900 32px monospace'; ctx.textAlign='center'; ctx.strokeStyle='#000'; ctx.lineWidth=4; ctx.strokeText(score,canvas.width/2,50); ctx.fillText(score,canvas.width/2,50);
 if(perfectStreak>=2){ctx.fillStyle='#0f0'; ctx.font='900 12px Arial'; ctx.fillText(`STREAK x${perfectStreak} ${noCut?'[NO CUT]':''} ${perfectMode?'[PERFECT]':''}`,canvas.width/2,70);}
 if(adminMode){ctx.fillStyle='#a0f'; ctx.font='900 10px Arial'; ctx.textAlign='left'; ctx.fillText('ADMIN ON',8,16);}
}
function die(){
 gameState='menu'; let overlay=$('overlay'); overlay.classList.remove('hidden');
 overlay.innerHTML=`<div style="font-size:44px">🏗️💥</div><div style="font-size:32px;font-weight:900">${score} BLOKŮ</div><div style="color:${score>=best&&score>0?'gold':'#888'};font-size:11px">${score>=best&&score>0?'🔥 REKORD!':'BEST: '+best}</div><div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-gold" onclick="startGame()">ZNOVU TURBO</button><button class="btn btn-admin" onclick="openAdmin()">🔐 ADMIN</button></div>`;
}
function resetAll(){if(confirm('Reset best + coiny?')){localStorage.removeItem('stack_money'); localStorage.removeItem('stack_best'); money=0; best=0; save(); updateUI();}}

// ADMIN - kód lokis, nikde nezobrazený
let logoClicks=0, lastClick=0;
function secretAdmin(){let now=Date.now(); if(now-lastClick>1000) logoClicks=0; logoClicks++; lastClick=now; if(logoClicks>=5) openAdmin();}
function openAdmin(){
 let code=prompt('🔐 Zadej kód:');
 if(!code) return;
 if(code.toLowerCase()!=='lokis'){alert('❌ Špatný kód!'); return;}
 adminMode=true; $('adminPanel').classList.add('open');
}
function closeAdmin(){$('adminPanel').classList.remove('open'); adminMode=false; perfectMode=false; noCut=false;}
function adminAddMoney(){let v=parseInt($('addMoney').value)||0; money+=v; save();}
function adminSetMoney(){money=10000; save();}
function adminSetScore(){let v=parseInt($('setScore').value)||0; score=v; if(score>best) best=score; // fake blocks
 blocks=[]; let w=200; for(let i=0;i<v;i++){blocks.push({x:100+(Math.random()-0.5)*20,y:500-i*22,w:w,h:20,color:`hsl(${40+i*3},100%,50%)`}); w=Math.max(40,w- (Math.random()*2));}
 spawnBlock(); updateUI();
}
function adminSetBest(){best=score; localStorage.setItem('stack_best',best); updateUI();}
function adminWider(){if(curBlock) curBlock.w+=40; if(blocks.length>0) blocks[blocks.length-1].w+=40;}
function adminPerfect(){perfectMode=!perfectMode; alert(perfectMode?'💯 PERFECT MODE ON - každý blok perfect':'Perfect mode OFF');}
function adminSpeed(m){
 if(m===1){baseSpeed=2.0; speed=2.0;}
 else if(m===2){baseSpeed=7.0; speed=7.0;}
 else {baseSpeed=4.0; speed=4.0+score*0.18;}
 updateUI();
}
function adminNoCut(){noCut=true; alert('✂️ BEZ OŘEZU ON - bloky se nikdy nezužují');}
function adminNoCutOff(){noCut=false; alert('Ořez zapnut');}
function adminReset(){money=1000; best=0; save(); updateUI();}

document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault(); place();}});
canvas.addEventListener('touchstart',e=>{e.preventDefault(); place();},{passive:false});
canvas.addEventListener('mousedown',place);
$('tapBtn').addEventListener('touchstart',e=>{e.preventDefault(); place();},{passive:false});
$('tapBtn').addEventListener('mousedown',e=>{e.preventDefault(); place();});
window.onload=()=>{updateUI(); draw();};
</script>
</body>
</html>
